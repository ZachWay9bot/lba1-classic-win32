name: Win32 SDL3 OpenGL M1
on:
  push:
    paths:
      - 'port/win32/**'
      - '.github/workflows/win32-platform-m1.yml'
  pull_request:
    paths:
      - 'port/win32/**'
      - '.github/workflows/win32-platform-m1.yml'
  workflow_dispatch:

jobs:
  win32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure native 32-bit app
        run: cmake -S port/win32 -B build-win32 -G "Visual Studio 17 2022" -A Win32
      - name: Build Release
        run: cmake --build build-win32 --config Release --parallel 4
      - name: Package executable and SDL DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build-win32/Release/LBA1-Win32-M1.exe package/
          Copy-Item build-win32/Release/SDL3.dll package/
      - uses: actions/upload-artifact@v4
        with:
          name: LBA1-Win32-M1-x86
          path: package/*
